[project]
name = "scientific-discovery"
version = "0.1.0"
description = "Reproducible infrastructure for evidence-guided computer-science research agents"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

